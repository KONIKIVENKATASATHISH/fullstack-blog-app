<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav>
    <div class="logo">Blog Dashboard</div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="create-blog.html">Create Blog</a></li>
        <li><a href="login.html">Logout</a></li>
    </ul>
</nav>

<section class="blogs" id="blogs">
    <p>Loading blogs...</p>
</section>

<script>

fetch("http://localhost:5000/api/blogs")
    .then(response => response.json())
    .then(blogs => {

        const blogsContainer = document.getElementById("blogs");

        blogsContainer.innerHTML = "";

        blogs.forEach(blog => {

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${blog.title}</h3>
                <p>${blog.content}</p>
                <p>Author: ${blog.author}</p>

                <a href="blog.html?id=${blog.id}">Read More</a>

                <button onclick="editBlog('${blog.id}')">
                    Edit
                </button>

                <button onclick="deleteBlog('${blog.id}')">
                    Delete
                </button>
            `;

            blogsContainer.appendChild(card);
        });

    })
    .catch(error => {

        console.log("Error:", error);

        document.getElementById("blogs").innerHTML =
            "<p>Failed to load blogs.</p>";

    });


function editBlog(id) {

    window.location.href = `create-blog.html?id=${id}`;

}


function deleteBlog(id) {

    if (!confirm("Are you sure you want to delete this blog?")) {
        return;
    }

    fetch(`http://localhost:5000/api/blogs/${id}`, {
        method: "DELETE"
    })
    .then(response => response.json())
    .then(data => {

        alert(data.message);

        location.reload();

    })
    .catch(error => {

        console.log("Error:", error);

    });

}

</script>

</body>
</html>
