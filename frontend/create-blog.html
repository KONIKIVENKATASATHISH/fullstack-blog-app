<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <h2>Create Blog</h2>

    <form id="blogForm">
    <input type="text" id="title" placeholder="Blog Title" required>

    <textarea id="content" placeholder="Write your blog here..."
    rows="6"
    style="width:100%;padding:10px;margin-bottom:15px;"></textarea>

    <button type="submit">Publish Blog</button>
</form>

</div>
<script>
document.getElementById("blogForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    const response = await fetch("http://localhost:5000/api/blogs/create", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            content: content,
            author: "Sathesh"
        })
    });

    const data = await response.json();

    alert(data.message);
});
</script>

</body>
</html>
