<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <h2>Create Blog</h2>

    <form id="blogForm">
    <input type="text" id="title" placeholder="Blog Title" required>

    <textarea id="content" placeholder="Write your blog here..."
    rows="6"
    style="width:100%;padding:10px;margin-bottom:15px;"></textarea>

    <button type="submit">Publish Blog</button>
</form>

</div>
<script>

const blogId = new URLSearchParams(window.location.search).get("id");

const form = document.getElementById("blogForm");
const titleInput = document.getElementById("title");
const contentInput = document.getElementById("content");


// If editing an existing blog
if (blogId) {

    document.querySelector("h2").innerText = "Edit Blog";
    document.querySelector("button").innerText = "Update Blog";

    fetch(`http://localhost:5000/api/blogs/${blogId}`)
        .then(response => response.json())
        .then(blog => {

            titleInput.value = blog.title;
            contentInput.value = blog.content;

        });
}


// Create or Update Blog
form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const title = titleInput.value;
    const content = contentInput.value;

    let url;
    let method;

    if (blogId) {

        // Update
        url = `http://localhost:5000/api/blogs/${blogId}`;
        method = "PUT";

    } else {

        // Create
        url = "http://localhost:5000/api/blogs/create";
        method = "POST";

    }

    const response = await fetch(url, {

        method: method,

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            title: title,
            content: content,
            author: "Mishu"
        })

    });

    const data = await response.json();

    alert(data.message);

    window.location.href = "dashboard.html";

});

</script>

</body>
</html>
